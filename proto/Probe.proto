syntax = "proto3";
option go_package = "proto";

package proto;

service ProbeService {
    rpc ReportSystemState(State)returns(Receipt){}
    rpc ReportSystemInfo(Host)returns(Receipt){}
    rpc ReportTask(TaskResult)returns(Receipt){}
    rpc RequestTask(Host)returns(stream Task){}
}

message Host {
    string platform = 1;
    string platform_version = 2;
    repeated string cpu = 3;
    uint64 mem_total = 4;
    uint64 disk_total = 5;
    uint64 swap_total = 6;
    string arch = 7;
    string virtualization = 8;
    uint64 boot_time = 9;
    string ip = 10;
    string country_code = 11;
    string version = 12;
}

// NICCounter 是单张网卡自开机以来的原始累计计数。
// Agent 上报全部网卡的原始值，由服务端按管理员选中的网卡集合求和，
// 这样切换统计口径无需重新下发配置给 Agent。
message NICCounter {
    string name = 1;
    uint64 bytes_recv = 2;
    uint64 bytes_sent = 3;
    // virtual 由 Agent 按网卡名前缀判定，服务端据此实现「默认只统计物理网卡」。
    bool virtual = 4;
}

message State {
    double cpu = 1;
    uint64 mem_used = 3;
    uint64 swap_used = 4;
    uint64 disk_used = 5;
    uint64 net_in_transfer = 6;
    uint64 net_out_transfer = 7;
    uint64 net_in_speed = 8;
    uint64 net_out_speed = 9;
    uint64 uptime = 10;
    // nic_counters 为每张网卡的原始计数明细，老 Agent 不填。
    repeated NICCounter nic_counters = 11;
}

message Task {
    uint64 id = 1;
    uint64 type = 2;
    string data = 3;
}

message TaskResult {
    uint64 id = 1;
    uint64 type = 2;
    float delay = 3;
    string data = 4;
    bool successful = 5;
}

message Receipt{
    bool proced = 1;
}
