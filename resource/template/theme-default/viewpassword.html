{{define "theme-default/viewpassword"}}
{{template "common/header" .}}
{{if ts .CustomCode}}
{{.CustomCode|safe}}
{{end}}
<main class="nk-auth-page">
    <section class="nk-auth-panel">
        <div class="nk-auth-panel-top">
            <a class="nk-auth-brand" href="/">
                <img src="/static/logo.svg" alt="nodekeep">
                <span>{{.Conf.Site.Brand}}</span>
            </a>
            <button class="nk-theme-toggle" type="button" onclick="if (window.toggleColorMode) window.toggleColorMode()"
                aria-label="切换深色/浅色模式" data-tooltip="切换明暗主题" data-position="bottom right">
                <svg class="nk-theme-svg nk-theme-svg-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
                <svg class="nk-theme-svg nk-theme-svg-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
            </button>
        </div>
        <h1>验证查看密码</h1>
        <p>该前台页面已开启访问保护，请输入查看密码。</p>
        <form action="/view-password" method="POST" class="ui form nk-auth-form">
            <div class="field">
                <label>查看密码</label>
                <input type="password" name="Password" autocomplete="current-password" required>
            </div>
            <button class="ui fluid primary button" type="submit">确认访问</button>
        </form>
    </section>
</main>
{{template "common/footer" .}}
{{end}}
